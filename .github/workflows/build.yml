# Checks and builds the app with Tiro's shared workflow. On pushes to main it publishes the
# app to https://<app>.tirohealth.app once the checks and build pass.
#
# The app's name comes from the repository variable TIRO_EHR_APP_NAME. When you link this
# repository on the EHR's setup page (https://ehr.tiro.health/platform/setup), Tiro.health sets
# it and starts this workflow once the app is set up. Until then pushes to main are checked and
# built, and the publish job passes with a "Not published" notice. Change nothing in this file.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Only for Tiro's template repository itself, which is no app: it skips pushes to its main,
    # where the shared workflow would always publish. Its pull requests are still checked and
    # built. In your app this line does nothing; leave it or remove it.
    if: github.repository != 'Tiro-health/ehr-app-for-mds' || github.ref != 'refs/heads/main'
    uses: Tiro-health/ehr-app-build/.github/workflows/build.yml@v2
    with:
      app: ${{ vars.TIRO_EHR_APP_NAME }}
    # The publish step signs in to Google Cloud with this run's GitHub identity. A called
    # workflow gets no more permissions than these.
    permissions:
      contents: read
      id-token: write
