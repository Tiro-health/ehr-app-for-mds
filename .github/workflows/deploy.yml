# Checks the app on every push to main and publishes it to https://<app>.tirohealth.app.
# Publishing starts once the repository variable TIRO_APP holds the app's registered name
# (see the publish skill). Until then only the check runs.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  deploy:
    needs: check
    if: vars.TIRO_APP != ''
    uses: Tiro-health/ehr-app-deploy/.github/workflows/deploy.yml@v1
    with:
      app: ${{ vars.TIRO_APP }}
