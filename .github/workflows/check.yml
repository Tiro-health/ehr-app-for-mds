# Checks the app (types, lint, format, tests) on every push to main and on pull requests.
# Publishing is not done here: the Tiro Deploy GitHub App builds and deploys each push to
# main to https://<app>.tirohealth.app (see the publish skill).
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Its automatic cache needs pnpm installed first; corepack installs it below.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
